name: Coleta editorial Giro63
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency:
  group: giro63-editorial-automation
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Executar lote com identidade temporária
        shell: bash
        run: |
          node --input-type=module <<'JS'
          for(let batch=0;batch<4;batch++){
            // Each request gets its own one-use identity and bounded server execution.
            const tokenUrl=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            tokenUrl.searchParams.set('audience','giro63-automation');
            const issued=await fetch(tokenUrl,{headers:{Authorization:'Bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}});
            if(!issued.ok)throw Error('Não foi possível obter a identidade do workflow.');
            const {value}=await issued.json();
            const response=await fetch('https://giro63.vercel.app/internal/automation/run',{method:'POST',headers:{Authorization:'Bearer '+value},signal:AbortSignal.timeout(70000)});
            if(!response.ok)throw Error('Automação respondeu HTTP '+response.status);
            const result=await response.json();console.log('Lote '+(batch+1)+': '+result.message+' Itens processados: '+(result.processed||0));
          }
          JS
