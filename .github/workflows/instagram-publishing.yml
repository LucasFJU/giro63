name: Instagram Giro63
on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency:
  group: giro63-instagram
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Retomar fila com identidade temporária
        shell: bash
        run: |
          node --input-type=module <<'JS'
          for(let batch=0;batch<3;batch++){
            const url=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);url.searchParams.set('audience','giro63-instagram');
            const issued=await fetch(url,{headers:{Authorization:'Bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}});if(!issued.ok)throw Error('Identidade indisponível.');
            const {value}=await issued.json();
            const response=await fetch('https://giro63.vercel.app/internal/instagram/run',{method:'POST',headers:{Authorization:'Bearer '+value},signal:AbortSignal.timeout(65000)});
            if(!response.ok)throw Error('Fila respondeu HTTP '+response.status);
            const result=await response.json();console.log(result.message+' Preparados: '+(result.prepared||0)+'; enviados: '+(result.sent||0));
          }
          JS
